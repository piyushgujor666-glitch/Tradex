<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tredx sign-up</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body style="width: 100%;height: 100vh;align-items: center;display: flex;flex-direction: column;background-color: navy;">
    <form style="width: 450px;height: 650px;background-color: gray;border-radius: 20px;padding: 40px;">
        <div style="display: flex; gap: 10px;">
        <i class="fa-solid fa-arrow-trend-up" style="color: linear-gradient(45deg,#2563eb,#7c3aed);font-size: 65px;font-weight: bold;color: green;"></i>
        <h1>TredX</h1>
        </div> 
        <h1 style="border: 0.5px solid black;margin-top: 10px;"></h1>
        <h1 style="font-size: 38px;color: white;font-weight: bold;">Create Account</h1>
        <p style="font-size: 16px;color: lightgray;height: 25px;">Start your trading journey today.</p>
        <lable>
            <div>
            <input type="text" placeholder="Enter your name" style="width: 100%; height: 55px;border-radius: 10px;padding-left: 15px;font-size: 17px;display: flex;flex-direction: column;">
            <input type="email" placeholder="Enter your email" style="width: 100%; height: 55px;border-radius: 10px;padding-left: 15px;font-size: 17px;display: flex;flex-direction: column;margin-top: 20px;">
            <input type="Password" placeholder="Enter your Password" style="width: 100%; height: 55px;border-radius: 10px;padding-left: 15px;font-size: 17px;display: flex;flex-direction: column;margin-top: 20px;">
            <input type="password" placeholder="Confirm your Password" style="width: 100%; height: 55px;border-radius: 10px;padding-left: 15px;font-size: 17px;display: flex;flex-direction: column;margin-top: 20px;">
            </div>
            <lable><br>
            <input type="checkbox" id="Agree to Terms & Conditions">
            <label for="Agree to Terms & Conditions" style="font-size: 20px;">Agree to Terms & Conditions</label>
            </lable>
            <button style="width: 100%;height: 55px;background-color: green;border-radius: 10px;font-size: 20px;color: white;margin-top: 20px;">sign up</button>
        </lable>
        <label>
            <div style="display: flex;justify-content: space-around; margin-top: 10px;">
            <div>
            Already have an account?<a href="login.html" style="text-decoration: none;color: black;">Login</a>
            </div>
            <a href="index.html" style="text-decoration: none;color:black;">Home</a>
            </div>
        </label>
    </form>
</body>
</html>
